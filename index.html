<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SMK sculpture gallery</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="intro">
      <div class="card">
        <h1>SMK sculpture gallery</h1>
        <p class="credit">
          Experiment by Christian Dalager on top of
          <a href="https://open.smk.dk/" target="_blank" rel="noopener">SMK Open</a>
        </p>
        <p id="intro-status">Loading…</p>
        <button id="enter" type="button" disabled>Click to walk</button>
        <div class="tour-actions">
          <select id="tour-route" aria-label="Tour route">
            <option value="grand">Grand tour · 92 s</option>
            <option value="quick">Quick tour · 45 s</option>
          </select>
          <button id="tour-play" type="button" class="secondary" disabled>Watch drone tour</button>
          <button id="tour-record" type="button" class="secondary" disabled>Record tour video</button>
        </div>
        <p class="keys">
          <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move · mouse look ·
          <kbd>Shift</kbd> faster · <kbd>I</kbd> stats · <kbd>P</kbd> screenshot · <kbd>Esc</kbd> release or stop the tour
        </p>
      </div>
    </div>
    <div id="crosshair" hidden></div>
    <div id="room-name"></div>
    <aside id="label" hidden></aside>
    <pre id="stats" hidden></pre>
    <div id="toast" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
